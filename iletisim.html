<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>İletişim</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

<style>
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

.form-box{
background:#1e293b;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input,textarea,select{
background:#0f172a !important;
color:white !important;
border:none !important;
}

input:focus,textarea:focus{
outline:none;
box-shadow:0 0 10px #38bdf8;
}

.btn{
border-radius:10px;
}
</style>

</head>

<body>

<div class="container mt-5" id="app">

<div class="form-box">

<h2 class="text-center mb-4">📩 Bize Ulaş</h2>

<form action="iletisim.php" method="POST">

<input type="text" name="ad" placeholder="Adınız" class="form-control mt-2" v-model="ad">

<input type="email" name="email" placeholder="Email" class="form-control mt-2" v-model="email">

<input type="text" name="telefon" placeholder="Telefon" class="form-control mt-2" v-model="telefon">

<select name="konu" class="form-control mt-2">
<option>Genel</option>
<option>Şikayet</option>
<option>Öneri</option>
</select>

<textarea name="mesaj" class="form-control mt-2" placeholder="Mesajınız"></textarea>

<div class="d-flex justify-content-between mt-4">

<button type="button" class="btn btn-warning" onclick="kontrol()">JS Kontrol</button>

<button type="button" class="btn btn-info" @click="vueKontrol">Vue Kontrol</button>

<button type="submit" class="btn btn-success">Gönder</button>

</div>

</form>

</div>

</div>

<script>

function kontrol(){

let email=document.getElementsByName("email")[0].value;
let tel=document.getElementsByName("telefon")[0].value;

if(email=="" || tel==""){
alert("Boş alan var");
return;
}

if(!email.includes("@")){
alert("Email hatalı");
return;
}

if(isNaN(tel)){
alert("Telefon sadece rakam olmalı");
return;
}

alert("JS kontrol başarılı ✔");
}

new Vue({
el:"#app",
data:{
ad:"",
email:"",
telefon:""
},
methods:{
vueKontrol(){
if(this.ad=="" || this.email=="" || this.telefon==""){
alert("Vue: boş alan var ❌");
}
else{
alert("Vue kontrol başarılı ✔");
}
}
}
});

</script>

</body>
</html>

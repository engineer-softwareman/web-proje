<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
overflow:hidden;
position:relative;
}

/* ARKA PLAN EFEKTLERİ */

.circle{
position:absolute;
border-radius:50%;
filter:blur(80px);
opacity:0.5;
}

.circle1{
width:300px;
height:300px;
background:#38bdf8;
top:-100px;
left:-100px;
}

.circle2{
width:300px;
height:300px;
background:#818cf8;
bottom:-100px;
right:-100px;
}

/* LOGIN BOX */

.login-box{
width:400px;
padding:50px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
border-radius:25px;
box-shadow:0 0 40px rgba(0,0,0,0.4);
z-index:1;
}

.login-box h1{
text-align:center;
margin-bottom:10px;
font-size:40px;
font-weight:bold;
background:linear-gradient(to right,#38bdf8,#818cf8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.login-box p{
text-align:center;
margin-bottom:30px;
color:#94a3b8;
}

.input-box{
position:relative;
margin-bottom:25px;
}

.input-box input{
width:100%;
padding:15px 15px 15px 50px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
}

.input-box input:focus{
outline:none;
box-shadow:0 0 15px rgba(56,189,248,0.5);
}

.input-box i{
position:absolute;
top:16px;
left:15px;
color:#38bdf8;
font-size:18px;
}

.login-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#38bdf8,#6366f1);
color:white;
font-size:18px;
font-weight:bold;
transition:0.3s;
}

.login-btn:hover{
transform:scale(1.03);
}

.back-home{
text-align:center;
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
}

</style>

</head>

<body>

<!-- BACKGROUND -->

<div class="circle circle1"></div>
<div class="circle circle2"></div>

<!-- LOGIN -->

<div class="login-box">

<h1>LOGIN</h1>

<p>
Portfolio sistemine giriş yapın
</p>

<form action="login.php" method="POST">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Email"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
name="sifre"
placeholder="Şifre"
required>

</div>

<button class="login-btn">
Giriş Yap
</button>

</form>

<div class="back-home">

<a href="index.html">
← Ana Sayfaya Dön
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İlgi Alanlarım</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
}

.card{
background:#1e293b;
color:white;
border:none;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

input{
background:#1e293b;
border:none;
color:white;
}

.btn-trailer{
background:#e11d48;
color:white;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark bg-black">
<div class="container">
<a class="navbar-brand">🎬 Film Paneli</a>
</div>
</nav>

<div class="container mt-5 text-center">

<h1>🔥 Favori Filmlerim</h1>
<p>Arama yap, incele, trailer izle</p>

<input type="text" id="search" class="form-control mt-3" placeholder="Film ara...">

<div class="row mt-4" id="filmList"></div>

</div>

<script>

const filmler = [
{
isim:"The Godfather",
puan:"9.2",
img:"https://image.tmdb.org/t/p/w500/3bhkrj58Vtu7enYsRolD1fZdja1.jpg",
trailer:"https://www.youtube.com/watch?v=sY1S34973zA"
},
{
isim:"The Godfather Part II",
puan:"9.0",
img:"https://image.tmdb.org/t/p/w500/hek3koDUyRQk7FIhPXsa6mT2Zc3.jpg",
trailer:"https://www.youtube.com/watch?v=9O1Iy9od7-A"
},
{
isim:"Av Mevsimi",
puan:"7.8",
img:"https://upload.wikimedia.org/wikipedia/tr/5/5c/Av_Mevsimi_film.jpg",
trailer:"https://www.youtube.com/watch?v=5xZ0sWnF0S8"
},
{
isim:"Titanic",
puan:"7.9",
img:"https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg",
trailer:"https://www.youtube.com/watch?v=kVrqfYjkTdQ"
},
{
isim:"Fight Club",
puan:"8.8",
img:"https://image.tmdb.org/t/p/w500/bptfVGEQuv6vDTIMVCHjJ9Dz8PX.jpg",
trailer:"https://www.youtube.com/watch?v=SUXWAEX2jlg"
},
{
isim:"Scarface",
puan:"8.3",
img:"https://image.tmdb.org/t/p/w500/iQ5ztdjvteGeboxtmRdXEChJOHh.jpg",
trailer:"https://www.youtube.com/watch?v=7pQQHnqBa2E"
}
];

function goster(liste){
let html="";
liste.forEach(film=>{
html+=`
<div class="col-md-4 mb-4">
<div class="card h-100">
<img src="${film.img}" class="card-img-top">
<div class="card-body">
<h5>${film.isim}</h5>
<p>⭐ IMDB: ${film.puan}</p>
<a href="${film.trailer}" target="_blank" class="btn btn-trailer">Trailer İzle</a>
</div>
</div>
</div>
`;
});
document.getElementById("filmList").innerHTML=html;
}

goster(filmler);

document.getElementById("search").addEventListener("input", function(){
let val=this.value.toLowerCase();
let filtre=filmler.filter(f=>f.isim.toLowerCase().includes(val));
goster(filtre);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
height:100vh;
background:linear-gradient(135deg,#020617,#0f172a);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-family:Arial;
}

.login-box{
width:350px;
padding:30px;
background:#1e293b;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
text-align:center;
}

input{
background:#020617 !important;
border:none !important;
color:white !important;
margin-top:10px;
}

input:focus{
box-shadow:0 0 10px #38bdf8;
}

.btn-login{
background:#22c55e;
border:none;
width:100%;
margin-top:15px;
}

.error{
color:#ef4444;
font-size:14px;
}
</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Giriş Paneli</h2>

<form action="login.php" method="POST" onsubmit="return kontrol()">

<input type="text" name="email" placeholder="Email" class="form-control" id="email">
<div id="emailHata" class="error"></div>

<input type="password" name="sifre" placeholder="Şifre" class="form-control" id="sifre">
<div id="sifreHata" class="error"></div>

<button class="btn btn-login">Giriş Yap</button>

</form>

</div>

<script>

function kontrol(){

let email=document.getElementById("email").value;
let sifre=document.getElementById("sifre").value;

let hata=false;

document.getElementById("emailHata").innerText="";
document.getElementById("sifreHata").innerText="";

if(email==""){
document.getElementById("emailHata").innerText="Email boş bırakılamaz";
hata=true;
}
else if(!email.includes("@sakarya.edu.tr")){
document.getElementById("emailHata").innerText="Okul maili gir";
hata=true;
}

if(sifre==""){
document.getElementById("sifreHata").innerText="Şifre boş";
hata=true;
}

return !hata;

}

</script>

</body>
</html>
